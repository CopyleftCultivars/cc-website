on:
  workflow_dispatch:
  push:
    branches: main
  schedule:
    # Mondays 14:00 UTC: rebuild so the Facts page picks up fresh numbers.
    - cron: "0 14 * * 1"

name: Quarto Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Refresh facts page numbers
        if: hashFiles('scripts/build_facts.py') != ''
        continue-on-error: true
        run: python3 scripts/build_facts.py

      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
